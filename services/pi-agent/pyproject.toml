[project]
name = "hack-the-body-pi-agent"
version = "0.1.0"
description = "MQTT-controlled kiosk agent for the office Pi: power, brightness, browser reload/navigate/type, reboot, screen preview."
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.1",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "websockets>=13",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.16.1,<0.17",
]

[project.scripts]
htb-pi-agent = "htb_pi_agent.main:run"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D", "ANN", "FA", "COM812", "ISC001",
  "EM101", "EM102", "TRY003", "G004", "BLE001", "PLR0913",
  "RUF012", "S311", "TD", "FIX", "TRY300", "TC", "PGH003", "ERA001", "CPY",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PT", "INP001", "SLF001"]
"src/htb_pi_agent/actions.py" = ["S603", "S607"]  # shells out to fixed system tools on PATH (xset, ddcutil, xdotool, scrot)

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htb_pi_agent"]
